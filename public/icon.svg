<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141A21" />
      <stop offset="50%" stop-color="#0E1217" />
      <stop offset="100%" stop-color="#070A0D" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAB52" />
      <stop offset="100%" stop-color="#FF7A1A" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 171, 82, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 122, 26, 0.05)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Safe Zone Graphic: FIT APP F Icon with Athletic Dynamic Angles -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Dynamic F Monogram / Barbell Chevron Motif -->
    <!-- Top Bar -->
    <path d="M-80 -120 L80 -120 Q95 -120 102 -106 L110 -90 Q116 -76 104 -64 L90 -50 Q78 -38 62 -38 L-30 -38 L-30 0 L50 0 Q65 0 72 14 L80 30 Q86 44 74 56 L60 70 Q48 82 32 82 L-30 82 L-30 115 Q-30 130 -45 130 L-75 130 Q-90 130 -90 115 L-90 -105 Q-90 -120 -80 -120 Z" fill="url(#brandGrad)" />
    
    <!-- Sharp High-Performance Accent Slice -->
    <polygon points="50,-110 95,-110 115,-70 70,-70" fill="#FFFFFF" opacity="0.85" />
    <polygon points="25,-10 70,-10 85,25 40,25" fill="#FFFFFF" opacity="0.85" />
  </g>
</svg>
